{{ $images := split (.Get "images") "," }}
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 2rem 0;">
{{ range $images }}
  {{ $img := trim . " " }}
  <a href="/images/{{ $img }}" class="gallery-item" onclick="openLightbox(event, '/images/{{ $img }}')">
    <img src="/images/{{ $img }}" alt="Photo" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.3s;">
  </a>
{{ end }}
</div>
